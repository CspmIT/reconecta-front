user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {

        ##
        # Basic Settings
        ##

        sendfile on;
        tcp_nopush on;
        types_hash_max_size 2048;
        # server_tokens off;

        # server_names_hash_bucket_size 64;
        # server_name_in_redirect off;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ##
        # SSL Settings
        ##

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
        ssl_prefer_server_ciphers on;

        ##
        # Logging Settings
        ##

        error_log /var/log/nginx/error.log debug;
        access_log /var/log/nginx/access.log;

        ##
        # Gzip Settings
        ##

        gzip on;

        # gzip_vary on;
        # gzip_proxied any;
        # gzip_comp_level 6;
        # gzip_buffers 16 8k;
        # gzip_http_version 1.1;
        # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        ##
        # Virtual Host Configs
        ##

        include /etc/nginx/conf.d/*.conf;
        include /etc/nginx/sites-enabled/*;
    
        server {
            listen 80;
            server_name cooptech.com.ar *.cooptech.com.ar;

            root /usr/share/nginx/html;
            index index.html;

            location / {
                try_files $uri $uri/ /index.html;
            }

            # El index.html NO se cachea y los assets del build SI, para siempre.
            #
            # Vite le pone un hash en el nombre a cada chunk, asi que un archivo
            # de /assets nunca cambia de contenido: se puede cachear un año. El
            # index.html es el que dice que hash toca hoy, y si el navegador se
            # queda con uno viejo pide chunks que ya no estan en la imagen.
            location = /index.html {
                add_header Cache-Control "no-store";
            }

            # Los dos bloques de /assets responden 404 cuando el archivo no esta,
            # en vez de caer en el index.html: sin el =404 el try_files de arriba
            # devuelve el HTML con MIME text/html y el navegador corta con
            # "Failed to load module script", que no dice nada de lo que realmente
            # paso (el deploy cambio los hashes de los chunks).

            # Los chunks del build llevan el hash del contenido en el nombre, asi
            # que ese archivo nunca cambia: se cachea para siempre. El regex gana
            # sobre el prefijo de abajo, que es como nginx resuelve la prioridad.
            location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.[^./]+$" {
                add_header Cache-Control "public, max-age=31536000, immutable";
                try_files $uri =404;
            }

            # El resto de /assets sale de public/assets (img y font) y NO lleva
            # hash: se sobreescribe con el mismo nombre en cada deploy, asi que un
            # cache largo dejaria la version vieja pegada por un año.
            location /assets/ {
                add_header Cache-Control "public, max-age=3600";
                try_files $uri =404;
            }

            # El service worker no se cachea. Si queda una copia vieja en el
            # navegador o en Cloudflare, cualquier cambio en las notificaciones
            # tarda horas en llegar al telefono.
            location = /sw.js {
                add_header Cache-Control "no-cache";
            }
        }
}